name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mit Submodulen
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: SDK-Pakete und NDK installieren
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: ./gradlew assembleNonRoot_gameDebug --no-daemon --stacktrace

      - name: APKs hochladen
        uses: actions/upload-artifact@v4
        with:
          name: artemis-amlogic-hevc-fixes-apk
          path: app/build/outputs/apk/nonRoot_game/debug/*.apk
          if-no-files-found: error
          retention-days: 30
